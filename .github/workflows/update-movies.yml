name: Update movie releases

on:
  schedule:
    # Once a day, UTC. Digital release dates rarely change more often.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movie-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch digital movie releases
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          MIN_IMDB_RATING: "7.0"
        run: python movies.py

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movie_releases.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update movie releases [skip ci]"

          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              pushed=true
              break
            fi
            echo "Push failed, retrying..."
            sleep 5
          done

          if [ "$pushed" != "true" ]; then
            echo "Could not push generated JSON"
            exit 1
          fi
